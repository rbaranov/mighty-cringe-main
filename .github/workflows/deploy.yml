name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    environment: production
    runs-on: [self-hosted, linux, x64, mighty-cringe-production]
    steps:
      - name: Check out the approved main revision
        uses: actions/checkout@v4

      - name: Deploy the approved main revision
        working-directory: infra/production
        env:
          PRODUCTION_ENV_FILE: /etc/mighty-cringe/production.env
        run: |
          set -eu
          docker compose --env-file "$PRODUCTION_ENV_FILE" up -d --build --remove-orphans || {
            docker compose --env-file "$PRODUCTION_ENV_FILE" logs --no-color migrate
            exit 1
          }
