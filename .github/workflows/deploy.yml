name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    environment: production
    runs-on: [self-hosted, linux, x64, mighty-cringe-production]
    steps:
      - name: Deploy the approved main revision
        run: |
          set -eu
          cd /srv/mighty-cringe
          git fetch origin main
          git reset --hard origin/main
          cd infra/production
          docker compose up -d --build
