name: mighty-cringe

x-logging: &default-logging
  driver: local
  options:
    max-size: 10m
    max-file: '3'

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-.env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    logging: *default-logging
    networks:
      - edge

  web:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.web
    restart: unless-stopped
    logging: *default-logging
    networks:
      - edge

  api:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.api
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_STT_MODEL: ${OPENROUTER_STT_MODEL:-}
      EXERCISE_DISCOVERY_MODEL: ${EXERCISE_DISCOVERY_MODEL:-}
      VOICE_S3_ACCESS_KEY_ID: ${VOICE_S3_ACCESS_KEY_ID:-}
      VOICE_S3_BUCKET: ${VOICE_S3_BUCKET:-}
      VOICE_S3_ENCRYPTION_KEY: ${VOICE_S3_ENCRYPTION_KEY:-}
      VOICE_S3_ENDPOINT: ${VOICE_S3_ENDPOINT:-}
      VOICE_S3_FORCE_PATH_STYLE: ${VOICE_S3_FORCE_PATH_STYLE:-false}
      VOICE_S3_REGION: ${VOICE_S3_REGION:-}
      VOICE_S3_SECRET_ACCESS_KEY: ${VOICE_S3_SECRET_ACCESS_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *default-logging
    networks:
      - edge
      - private

  worker:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.worker
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_STT_MODEL: ${OPENROUTER_STT_MODEL:-}
      VOICE_S3_ACCESS_KEY_ID: ${VOICE_S3_ACCESS_KEY_ID:-}
      VOICE_S3_BUCKET: ${VOICE_S3_BUCKET:-}
      VOICE_S3_ENCRYPTION_KEY: ${VOICE_S3_ENCRYPTION_KEY:-}
      VOICE_S3_ENDPOINT: ${VOICE_S3_ENDPOINT:-}
      VOICE_S3_FORCE_PATH_STYLE: ${VOICE_S3_FORCE_PATH_STYLE:-false}
      VOICE_S3_REGION: ${VOICE_S3_REGION:-}
      VOICE_S3_SECRET_ACCESS_KEY: ${VOICE_S3_SECRET_ACCESS_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *default-logging
    networks:
      - private
      - egress

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
    mem_limit: 256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging
    networks:
      - private

  migrate:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.api
    working_dir: /app/packages/db
    command: ['./node_modules/.bin/drizzle-kit', 'migrate', '--config', 'drizzle.config.ts']
    restart: 'no'
    env_file: ${PRODUCTION_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - private

  backup:
    profiles:
      - backup
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.backup
    env_file: ${PRODUCTION_ENV_FILE:-.env}
    environment:
      PGHOST: postgres
      AWS_DEFAULT_REGION: ${S3_REGION:-hel1}
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /backup:size=512m,mode=0700
      - /restore:size=512m,mode=0700
    logging: *default-logging
    networks:
      - private
      - egress

  restore-postgres:
    profiles:
      - backup
    image: postgres:17-alpine
    restart: 'no'
    env_file: ${PRODUCTION_ENV_FILE:-.env}
    environment:
      POSTGRES_DB: mightycringe_restore
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data:size=512m,mode=0700
    logging: *default-logging
    networks:
      - private

volumes:
  caddy_data:
  caddy_config:
  postgres_data:

networks:
  edge:
  private:
    internal: true
  egress:
