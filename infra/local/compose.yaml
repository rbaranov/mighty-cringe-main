name: mighty-cringe-local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mightycringe_local
      POSTGRES_USER: mightycringe
      POSTGRES_PASSWORD: local-development
    ports:
      - '127.0.0.1:${LOCAL_POSTGRES_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mightycringe -d mightycringe_local']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
